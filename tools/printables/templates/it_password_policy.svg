<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1448" viewBox="0 0 1024 1448">
  <rect x="0" y="0" width="1024" height="1448" fill="#f5f3eb"/>
  <!-- Original small kestrel silhouette, not a traced corporate logo. -->
  <polygon points="69,129 82,105 108,114 136,100 124,122 109,124 103,140 94,130 78,136" fill="#294b50"/>
  <text x="160" y="137" font-size="30" data-width="786" font-weight="bold" fill="#294b50"><tspan id="company">{{0}}</tspan></text>
  <text x="76" y="248" font-size="43" data-width="872" font-weight="bold" fill="#203d42"><tspan id="title">{{1}}</tspan></text>
  <line x1="76" y1="283" x2="948" y2="283" stroke="#365c60" stroke-width="4"/>
  <text x="76" y="354" font-size="32" data-width="872" data-wrap="words" data-leading="49" data-height="84" fill="#293332"><tspan id="pattern_intro">{{2}}</tspan></text>
  <text x="76" y="480" font-size="36" data-width="864" data-wrap="words" data-leading="57" data-height="160" fill="#222e2e"><tspan id="word_rule">{{3}}</tspan></text>
  <!-- The six allowed symbols use one exact string with its original spaces. -->
  <rect x="61" y="632" width="902" height="140" rx="5" fill="#e1e8e2"/>
  <text x="76" y="718" font-size="44" data-width="872" fill="#203d42"><tspan id="symbol_rule">{{4}}</tspan></text>
  <text x="76" y="855" font-size="36" data-width="864" data-wrap="words" data-leading="57" data-height="103" fill="#222e2e"><tspan id="year_rule">{{5}}</tspan></text>
  <text x="76" y="1028" font-size="43" data-width="872" font-weight="bold" fill="#294b50"><tspan id="example">{{6}}</tspan></text>
  <text x="76" y="1124" font-size="32" data-width="864" data-wrap="words" data-leading="50" data-height="90" fill="#293332"><tspan id="change_notice">{{7}}</tspan></text>
  <line x1="76" y1="1220" x2="948" y2="1220" stroke="#b4beb5" stroke-width="2"/>
  <text x="76" y="1274" font-size="30" data-width="864" data-wrap="words" data-leading="47" data-height="124" fill="#38443e"><tspan id="login_notice">{{8}}</tspan></text>
  <!-- Faint pin hole, top-right dog-ear and curled bottom edge stay in margins. -->
  <circle cx="512" cy="39" r="7" fill="#d2cec0" opacity="0.50"/>
  <circle cx="512" cy="38" r="3" fill="#827d6d" opacity="0.38"/>
  <polygon points="955,0 1024,72 955,72" fill="#ddd9cc" opacity="0.62"/>
  <polygon points="955,0 1024,72 1024,0" fill="#efede5"/>
  <line x1="955" y1="0" x2="1024" y2="72" stroke="#b8b4a5" stroke-width="2" opacity="0.50"/>
  <polyline points="0,1425 180,1432 420,1436 730,1430 1024,1423" fill="none" stroke="#ccc7b5" stroke-width="6" opacity="0.28"/>
  <polyline points="0,1419 180,1426 420,1430 730,1424 1024,1417" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.43"/>
</svg>
